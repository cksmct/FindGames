name: Keyword Radar

# ── 三种触发，都走同一条路：采集 → 存留档 → 发布 ──────────────
#   schedule（每小时 :23）    → 采集 + 发布
#   workflow_dispatch（手动） → 采集 + 发布（geos 可指定国家，留空 = 全部）
#   push 到 main（改动 web/ src/ config.json 等）→ 采集 + 发布
#
# 「采集」是 continue-on-error 的尽力而为：即使 Google 限流导致采集失败，
# 也会用已有留档继续把界面发布出去 —— 不会因为你改前端而卡在采集上。
#
# 7 天留档状态保存在专用分支 radar-data（每次单提交 force push 覆盖，仓库体积恒定）。
# 发布目标由仓库变量 DEPLOY_TARGET 控制（Settings → Secrets and variables → Actions → Variables）：
#   github-pages      （默认）发布到 GitHub Pages，零额外配置
#   cloudflare-pages  用 wrangler 直传 Cloudflare Pages（需要 2 个 Secret + 2 个 Variable）
#   none              只采集并存留档，不发布
on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "src/**"
      - "config.json"
      - "package.json"
      - ".github/workflows/radar.yml"
  schedule:
    # 用 UTC。刻意避开整点：GitHub 官方说「每小时整点」是高负载时段，schedule 会被明显延迟。
    # 想更新更勤可改成 "23,53 * * * *"（每 30 分钟）——采集是全量 24h 窗口 + 去重 + 峰值合并，
    # 多跑不会产生重复数据。
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      geos:
        description: "只跑指定国家（逗号分隔，如 US,GB,JP）；留空 = 全部"
        required: false
        default: ""
      skip_games:
        description: "跳过游戏雷达（省时间）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # 需要写 radar-data 分支
  pages: write      # 需要发布 Pages
  id-token: write   # deploy-pages 需要 OIDC

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.DEPLOY_TARGET == 'cloudflare-pages' && 'cloudflare-pages' || 'github-pages' }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # 跟随最新 LTS：Node 20 已 EOL；我们只用 fetch / ESM / fs 等稳定 API，不挑版本
          node-version: "lts/*"

      # 用 git archive 还原留档状态：不经 index，完全不受 .gitignore 影响；
      # 首次运行时 radar-data 分支还不存在，各步失败都无害，最后靠 [ -d data ] 判断
      - name: 恢复 7 天留档状态
        run: |
          set +e
          git fetch --depth=1 origin radar-data:refs/remotes/origin/radar-data 2>/dev/null
          git archive origin/radar-data data 2>/dev/null | tar -x 2>/dev/null
          if [ -d data ]; then
            echo "已恢复留档状态："
            ls -la data
          else
            echo "无历史留档，按首次运行处理（稍后采集会生成）"
          fi

      - name: 采集
        continue-on-error: true   # 尽力而为：采集失败也不阻塞发布
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.geos }}" ]; then ARGS="$ARGS --geos ${{ github.event.inputs.geos }}"; fi
          if [ "${{ github.event.inputs.skip_games }}" = "true" ]; then ARGS="$ARGS --no-games"; fi
          node src/collect.mjs $ARGS

      # 先存状态：即使发布环节没配好，数据也不会丢
      - name: 回写留档状态到 radar-data 分支
        run: |
          set -e
          if [ ! -d data ]; then echo "没有 data 目录（采集未产出），跳过存留档"; exit 0; fi
          mkdir -p /tmp/state
          cp -r data /tmp/state/data
          cd /tmp/state
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # radar-data 是机器专用分支，每次用单次提交覆盖，避免历史膨胀
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:radar-data

      - name: 组装静态站点
        id: build
        run: |
          mkdir -p data dist/data
          # 没有数据时宁可跳过发布，也不要用空目录覆盖掉线上正常的看板
          if ! ls data/*.json >/dev/null 2>&1; then
            echo "::warning::没有可用数据（radar-data 分支可能还不存在），跳过本次发布，等下一次采集"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cp -r web/. dist/
          # 显式排除 .state.json 等点文件：不同 shell 对 * 是否匹配点文件行为不一致，不靠 glob 语义
          find data -maxdepth 1 -type f -name '*.json' -not -name '.*' -exec cp -t dist/data/ {} +
          # 把 config.json 一起发布：改 trendsCompare 这类"只影响界面"的配置时能立刻生效
          cp config.json dist/data/config.json
          touch dist/.nojekyll
          du -sh dist

      # ── 方案 A：Cloudflare Pages（wrangler 直传，不占用 500 次/月的构建额度）──
      - name: 发布到 Cloudflare Pages
        if: steps.build.outputs.skip != '1' && vars.DEPLOY_TARGET == 'cloudflare-pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name="${{ vars.CF_PAGES_PROJECT }}" \
            --branch="${{ vars.CF_PAGES_BRANCH || 'main' }}"

      # ── 方案 B：GitHub Pages（默认）──
      - name: 配置 GitHub Pages
        if: steps.build.outputs.skip != '1' && vars.DEPLOY_TARGET != 'cloudflare-pages' && vars.DEPLOY_TARGET != 'none'
        uses: actions/configure-pages@v6

      - name: 上传 Pages 产物
        if: steps.build.outputs.skip != '1' && vars.DEPLOY_TARGET != 'cloudflare-pages' && vars.DEPLOY_TARGET != 'none'
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: 发布到 GitHub Pages
        if: steps.build.outputs.skip != '1' && vars.DEPLOY_TARGET != 'cloudflare-pages' && vars.DEPLOY_TARGET != 'none'
        id: deployment
        uses: actions/deploy-pages@v5
