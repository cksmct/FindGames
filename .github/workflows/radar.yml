name: Keyword Radar

# 每小时采集一次 Google Trends 实时上升热搜，组装静态看板并发布。
# 7 天留档状态保存在专用分支 radar-data（单次提交，每次 force push 覆盖，不会撑大仓库）。
#
# 发布目标由仓库变量 DEPLOY_TARGET 控制（Settings → Secrets and variables → Actions → Variables）：
#   github-pages      （默认）发布到 GitHub Pages，零额外配置
#   cloudflare-pages  用 wrangler 直传 Cloudflare Pages（需要 2 个 Secret + 2 个 Variable）
#   none              只采集并存留档，不发布
on:
  schedule:
    # 用 UTC。刻意避开整点：GitHub 官方明确说「每小时整点」是高负载时段，schedule 会被明显延迟。
    # 想更新更勤可改成 "23,53 * * * *"（每 30 分钟）——
    # 因为采集是全量 24h 窗口 + (词,地区) 去重 + 峰值合并，多跑不会产生重复数据，
    # 曲线取用还有 refreshHours 节流，不会额外消耗曲线配额。
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      geos:
        description: "只跑指定国家（逗号分隔，如 US,GB,JP）；留空=全部"
        required: false
        default: ""
      skip_games:
        description: "跳过游戏雷达（省时间）"
        type: boolean
        required: false
        default: false

permissions:
  contents: write   # 需要写 radar-data 分支
  pages: write      # 需要发布 Pages
  id-token: write   # deploy-pages 需要 OIDC

concurrency:
  group: radar
  cancel-in-progress: false

jobs:
  radar:
    runs-on: ubuntu-latest
    environment:
      name: ${{ vars.DEPLOY_TARGET == 'cloudflare-pages' && 'cloudflare-pages' || 'github-pages' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      # 用 git archive 还原留档状态：不经 index，完全不受 .gitignore 影响；
      # 首次运行时 radar-data 分支还不存在，各步失败都无害，最后靠 [ -d data ] 判断
      - name: 恢复 7 天留档状态
        run: |
          set +e
          git fetch --depth=1 origin radar-data:refs/remotes/origin/radar-data 2>/dev/null
          git archive origin/radar-data data 2>/dev/null | tar -x 2>/dev/null
          if [ -d data ]; then
            echo "已恢复留档状态："
            ls -la data
          else
            echo "无历史留档，按首次运行处理"
          fi

      - name: 采集
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.geos }}" ]; then ARGS="$ARGS --geos ${{ github.event.inputs.geos }}"; fi
          if [ "${{ github.event.inputs.skip_games }}" = "true" ]; then ARGS="$ARGS --no-games"; fi
          node src/collect.mjs $ARGS

      # 先存状态：即使发布环节没配好，数据也不会丢
      - name: 回写留档状态到 radar-data 分支
        run: |
          set -e
          mkdir -p /tmp/state
          cp -r data /tmp/state/data
          cd /tmp/state
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A data
          git commit -q -m "state: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          # radar-data 是机器专用分支，每次用单次提交覆盖，避免历史膨胀
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:radar-data

      - name: 组装静态站点
        run: |
          mkdir -p dist/data
          cp -r web/. dist/
          # 显式排除 .state.json 等点文件：不同 shell 对 * 是否匹配点文件的行为不一致，不靠 glob 语义
          find data -maxdepth 1 -type f -name '*.json' -not -name '.*' -exec cp -t dist/data/ {} +
          touch dist/.nojekyll
          du -sh dist

      # ── 方案 A：Cloudflare Pages（wrangler 直传，不占用 500 次/月的构建额度）──
      - name: 发布到 Cloudflare Pages
        if: vars.DEPLOY_TARGET == 'cloudflare-pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          npx --yes wrangler@latest pages deploy dist \
            --project-name="${{ vars.CF_PAGES_PROJECT }}" \
            --branch="${{ vars.CF_PAGES_BRANCH || 'main' }}"

      # ── 方案 B：GitHub Pages（默认）──
      - name: 配置 GitHub Pages
        if: vars.DEPLOY_TARGET != 'cloudflare-pages' && vars.DEPLOY_TARGET != 'none'
        uses: actions/configure-pages@v5

      - name: 上传 Pages 产物
        if: vars.DEPLOY_TARGET != 'cloudflare-pages' && vars.DEPLOY_TARGET != 'none'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: 发布到 GitHub Pages
        if: vars.DEPLOY_TARGET != 'cloudflare-pages' && vars.DEPLOY_TARGET != 'none'
        id: deployment
        uses: actions/deploy-pages@v4
